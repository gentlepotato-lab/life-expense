<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/logo-mark-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Pretendard — 한글·숫자 모두 고른 무료 서체(OFL).
         숫자가 같은 폭이라 금액이 세로로 가지런히 선다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <title>돈을 쓰다</title>

    <!-- 앱이 뜨기 전 잠깐 보이는 화면.
         React 가 붙기 전부터 보여야 해서 여기 인라인으로 둔다.
         자바스크립트가 준비되면 App이 이 요소를 걷어 낸다. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f8f9fa;
        transition: opacity 320ms ease;
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      /* 로고는 제가 알아서 움직인다(logo-h-anim.svg).
         여기서 또 띄워 올리면 펜이 획을 긋는 동안 그림 전체가 따라 올라가
         두 움직임이 어긋나 보인다. 그래서 떠오르기는 걷었다. */
      #splash img {
        width: min(58vw, 260px);
        height: auto;
      }
      /* 이름은 펜이 다 쓰고 손을 뗀 뒤에 올라온다. */
      #splash .splash-name {
        font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: #98a2b3;
        animation: splash-rise 420ms 1760ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
      }
      /* 움직임을 줄이도록 해 둔 기기에서는 이름이 바로 선다.
         로고 쪽 배려는 logo-h-anim.svg 안에 따로 들어 있다 — <img>로 불린
         그림은 제 안의 규칙만 보고, 이 바깥 규칙은 닿지 않는다. */
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-name { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo-h-anim.svg" alt="돈을 쓰다" />
      <span class="splash-name">돈을 쓰다</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
