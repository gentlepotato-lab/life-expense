<svg xmlns="http://www.w3.org/2000/svg" width="60" height="30" viewBox="0 0 60 30">
  <title>마스킹 테이프 — 사선</title>
  <!--
    일곱 가지 가운데 셋째. 연보라 바탕에 흰 사선이다.
    씀씀이의 카드 실적이 쓰던 사선 줄무늬를 종이 테이프로 옮긴 것이다.

    가로로 이어 붙여 쓰므로(background-repeat: repeat-x) 왼쪽 끝과 오른쪽 끝의
    물결이 맞물리도록 60 폭에 물결 넷을 넣었다 — 일곱 가지가 모두 같은 몸통이라
    무엇을 골라도 뜯긴 자리가 같다.

    한 칸(12)에 굵은 줄과 가는 줄을 짝지어 넣는다. 같은 굵기로만 되풀이하면
    벽지처럼 딱딱해지는데, 둘을 엇대면 리본처럼 결이 산다.
    60은 12로 나누어떨어지므로 이어 붙인 자리에서 짝이 어긋나지 않는다.
  -->
  <defs>
    <linearGradient id="stripeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1EEFC"/>
      <stop offset="1" stop-color="#E0DBF7"/>
    </linearGradient>

    <path id="stripeShape"
      d="M0 3.4 q7.5 -3.4 15 0 q7.5 -3.4 15 0 q7.5 -3.4 15 0 q7.5 -3.4 15 0
         L60 26.6 q-7.5 3.4 -15 0 q-7.5 3.4 -15 0 q-7.5 3.4 -15 0 q-7.5 3.4 -15 0 Z"/>

    <clipPath id="stripeClip">
      <use href="#stripeShape"/>
    </clipPath>

    <!-- 한 짝 — 굵은 줄 하나에 가는 줄 하나 -->
    <g id="stripePair" stroke="#FFFFFF" stroke-linecap="butt" fill="none">
      <path d="M0 34 L20 -4" stroke-width="2.6"/>
      <path d="M6.5 34 L26.5 -4" stroke-width="1" stroke-opacity="0.8"/>
    </g>
  </defs>

  <use href="#stripeShape" fill="url(#stripeBody)"/>

  <g clip-path="url(#stripeClip)">
    <use href="#stripePair" transform="translate(-24 0)"/>
    <use href="#stripePair" transform="translate(-12 0)"/>
    <use href="#stripePair"/>
    <use href="#stripePair" transform="translate(12 0)"/>
    <use href="#stripePair" transform="translate(24 0)"/>
    <use href="#stripePair" transform="translate(36 0)"/>
    <use href="#stripePair" transform="translate(48 0)"/>
    <use href="#stripePair" transform="translate(60 0)"/>
  </g>
</svg>
